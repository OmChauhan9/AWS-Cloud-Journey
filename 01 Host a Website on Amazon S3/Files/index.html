<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My S3 Static Website</title>

  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #020617, #0f172a);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 720px;
      padding: 3rem;
      background: rgba(17, 24, 39, 0.85);
      border-radius: 16px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    p {
      color: var(--muted);
      line-height: 1.6;
      font-size: 1.05rem;
    }

    .badge {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.5rem 1rem;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      font-weight: 600;
      font-size: 0.9rem;
    }

    footer {
      margin-top: 2.5rem;
      font-size: 0.85rem;
      color: #6b7280;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Hello from S3 👋</h1>
    <p>
      This is a fully static website hosted on Amazon S3.
      No servers. No frameworks. Just files, quietly existing.
    </p>

    <span class="badge">Static • Fast • Cheap</span>

    <footer>
      <p>
        Deployed via Amazon S3 Static Website Hosting<br />
        <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/WebsiteHosting.html" target="_blank">
          AWS Docs
        </a>
      </p>
    </footer>
  </main>
</body>
</html>
